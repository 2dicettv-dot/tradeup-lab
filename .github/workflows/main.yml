name: Update prices and publish

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download prices and build the site
        run: node update-prices.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Package the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
