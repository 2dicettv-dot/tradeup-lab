<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CS2 Trade-Up Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>:root {
  /* Layout idea: a dark tactical HUD. Slate-black field with a faint grid, frosted glass panels,
     neon rarity color on edges and badges, one cyan HUD accent for actions. Single dark theme by choice. */
  color-scheme: dark;
  --bg: #070a10;
  --panel: rgba(16, 23, 34, 0.7);
  --panel-2: rgba(22, 31, 45, 0.78);
  --field: #0a1018;
  --line: rgba(148, 178, 220, 0.13);
  --line-2: rgba(148, 178, 220, 0.24);
  --ink: #e8eef6;
  --ink-2: #b9c5d4;
  --muted: #8191a6;
  --accent: #3fd0ff;
  --accent-ink: #00141d;
  --good: #3ee08f;
  --bad: #ff6070;
  --warn: #ffb547;
  --font-display: 'Chakra Petch', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 14px;
  --fn: #2ec4a5;
  --mw: #8ad14a;
  --ft: #e5c54a;
  --ww: #f0973c;
  --bs: #e8564f;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1100px 560px at 8% -12%, rgba(63, 208, 255, 0.10), transparent 62%),
    radial-gradient(900px 600px at 108% 112%, rgba(211, 44, 230, 0.08), transparent 60%),
    linear-gradient(rgba(148, 178, 220, 0.035) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, rgba(148, 178, 220, 0.035) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small, small { font-size: 12.5px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.boot { padding: 48px 20px; text-align: center; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.08em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
.app {
  max-width: 1340px;
  margin: 0 auto;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
}
.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 22px 44px -28px rgba(0, 0, 0, 0.7);
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 -16px 16px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-radius: 0 0 var(--r) var(--r);
  border-top: 0;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand > span:last-child { display: grid; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background:
    linear-gradient(135deg, transparent 46%, var(--accent) 47% 53%, transparent 54%),
    conic-gradient(from 45deg, #eb4b4b, #d32ce6, #8847ff, #4b69ff, #e4ae39, #eb4b4b);
  box-shadow: 0 0 18px -4px var(--accent), inset 0 0 0 2px rgba(7, 10, 16, 0.75);
}
.brand-name { font: 700 17px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; }
.brand-sub { font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
.tabs { display: flex; gap: 4px; }
.tabs a {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 13px; border-radius: 10px; text-decoration: none;
  color: var(--ink-2); font: 600 13.5px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
}
.tabs a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.04); }
.tabs a.on { color: var(--ink); background: rgba(63, 208, 255, 0.1); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs-top { margin-right: auto; }
.tabs-bottom { display: none; }
.hdr-r { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.03); color: var(--ink-2);
  font: 600 12px/1.2 var(--font-body); white-space: nowrap; cursor: default;
}
button.chip { cursor: pointer; }
.chip-warn { color: var(--warn); border-color: rgba(255, 181, 71, 0.45); background: rgba(255, 181, 71, 0.08); }
.chip-accent { color: var(--accent); border-color: rgba(63, 208, 255, 0.45); background: rgba(63, 208, 255, 0.08); }
.chip-good { color: var(--good); border-color: rgba(62, 224, 143, 0.45); background: rgba(62, 224, 143, 0.08); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 14px; }
.steps a { font-weight: 600; }
.steps li { display: grid; gap: 6px; justify-items: start; }
.steps li > a, .steps li > .chip-btn { display: inline; }
.feed-url { font-size: 11.5px; color: var(--ink-2); word-break: break-all; user-select: all; background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; }
.feed-card { border-color: rgba(62, 224, 143, 0.28); }
.main { display: grid; gap: 16px; }
.main > *, .view > *, .panel > *, .contract-grid > *, .charts-grid > *, .manager-grid > *, .rgrid > *, .modal-b > * { min-width: 0; }
.toolbar select { min-width: 0; max-width: 100%; }
.view { display: grid; gap: 16px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; padding: 8px 0 4px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.04);
  color: var(--ink); font: 600 14px/1.1 var(--font-body); cursor: pointer; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); border-color: rgba(148, 178, 220, 0.4); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 26px -8px var(--accent); }
.btn.primary:hover:not(:disabled) { background: #6bdcff; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: rgba(255, 96, 112, 0.5); background: rgba(255, 96, 112, 0.06); }
.btn.big { min-height: 50px; padding: 12px 22px; font-size: 15.5px; font-family: var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.btn.sm { min-height: 32px; padding: 6px 10px; font-size: 13px; }
.btn.sel { border-color: var(--accent); color: var(--accent); background: rgba(63, 208, 255, 0.08); }
.btn.armed { border-color: var(--warn); color: var(--warn); background: rgba(255, 181, 71, 0.1); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px;
  border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
.icon-btn.sm { width: 28px; height: 28px; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; cursor: pointer; justify-self: start; }
.chip-btn {
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.03); color: var(--ink-2);
  padding: 4px 9px; border-radius: 999px; font: 600 12px/1.2 var(--font-body); cursor: pointer; white-space: nowrap;
}
.chip-btn:hover { color: var(--ink); border-color: rgba(148, 178, 220, 0.45); }
.chip-btn.on { color: #ffd88a; border-color: rgba(228, 174, 57, 0.7); background: rgba(228, 174, 57, 0.12); }
.chip-st { font: 700 11px/1 var(--font-display); color: #ff9c5b; letter-spacing: 0.06em; }
input:not([type='range']):not([type='checkbox']):not([type='file']), select, textarea {
  background: var(--field); border: 1px solid var(--line-2); border-radius: 9px;
  padding: 8px 10px; min-height: 38px; color: var(--ink); min-width: 0;
}
textarea { width: 100%; resize: vertical; font-family: var(--font-mono); font-size: 12.5px; }
select { cursor: pointer; max-width: 100%; }
input::placeholder, textarea::placeholder { color: #5f6e82; }
input[type='file'] { font-size: 13px; color: var(--ink-2); max-width: 100%; }
.numf {
  display: inline-flex; align-items: center; background: var(--field); border: 1px solid var(--line-2);
  border-radius: 9px; min-height: 36px; padding: 0 8px; gap: 2px; min-width: 0;
}
.numf:focus-within { border-color: var(--accent); }
.numf input { border: 0 !important; background: transparent !important; padding: 6px 2px !important; min-height: 0 !important; width: 100%; outline: none; }
.numf-a { color: var(--muted); font-size: 13px; }
.w-num { width: 118px; }
.w-money { width: 130px; }
.inline { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(255, 255, 255, 0.035); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 8px 12px; border-radius: 8px;
  font: 600 13.5px/1.1 var(--font-body); cursor: pointer; white-space: nowrap;
}
.seg button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2), 0 0 18px -8px var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch-track { width: 38px; height: 22px; border-radius: 999px; background: #1b2433; border: 1px solid var(--line-2); position: relative; flex: none; transition: background 0.15s; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #9aa8ba; transition: transform 0.15s, background 0.15s; }
.switch input:checked + .switch-track { background: rgba(63, 208, 255, 0.25); border-color: var(--accent); }
.switch input:checked + .switch-track .switch-thumb { transform: translateX(16px); background: var(--accent); }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-text { display: grid; font-weight: 600; font-size: 14px; line-height: 1.2; }
.switch-text small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.switch.is-off { opacity: 0.45; cursor: not-allowed; }

/* ---------- panels ---------- */
.panel { padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-width: 0; }
.panel-h h2 { margin: 0; font: 600 13px/1.2 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.count { color: var(--muted); font-family: var(--font-mono); letter-spacing: 0; margin-left: 6px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 12px 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cta-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.empty { padding: 18px; border: 1px dashed var(--line-2); border-radius: 12px; color: var(--ink-2); }
.empty p { margin: 0 0 6px; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
.note-warn { border-color: rgba(255, 181, 71, 0.35); background: rgba(255, 181, 71, 0.07); }
.note-bad { border-color: rgba(255, 96, 112, 0.35); background: rgba(255, 96, 112, 0.07); }
.note-good { border-color: rgba(62, 224, 143, 0.3); background: rgba(62, 224, 143, 0.06); }
.pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font: 700 11.5px/1.2 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid; white-space: nowrap; }
.pill-good { color: var(--good); border-color: rgba(62, 224, 143, 0.5); background: rgba(62, 224, 143, 0.08); }
.pill-bad { color: var(--bad); border-color: rgba(255, 96, 112, 0.5); background: rgba(255, 96, 112, 0.08); }
.pill-warn { color: var(--warn); border-color: rgba(255, 181, 71, 0.5); background: rgba(255, 181, 71, 0.08); }
.pill-accent { color: var(--accent); border-color: rgba(63, 208, 255, 0.5); background: rgba(63, 208, 255, 0.08); }
.tag-warn { color: var(--warn) !important; border-color: rgba(255, 181, 71, 0.4) !important; background: rgba(255, 181, 71, 0.08) !important; }
.tag-good { color: var(--good) !important; border-color: rgba(76, 222, 128, 0.4) !important; background: rgba(76, 222, 128, 0.08) !important; margin-left: 0; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font: 600 11px/1.5 var(--font-body); color: var(--ink-2); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); vertical-align: middle; }
.rpill {
  display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px;
  font: 700 11.5px/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--rc); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent);
  background: color-mix(in srgb, var(--rc) 12%, transparent);
}
.flow { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); min-width: 0; }
.tile-l { font: 600 11px/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tile-v { font: 600 20px/1.25 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 6px; overflow-wrap: anywhere; }
.tile-big .tile-v { font-size: 26px; }
.tile-s { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.tone-good .tile-v { color: var(--good); text-shadow: 0 0 22px rgba(62, 224, 143, 0.35); }
.tone-bad .tile-v { color: var(--bad); text-shadow: 0 0 22px rgba(255, 96, 112, 0.3); }
.tone-warn .tile-v { color: var(--warn); }
.tone-good.tile { border-color: rgba(62, 224, 143, 0.25); }
.tone-bad.tile { border-color: rgba(255, 96, 112, 0.22); }

/* ---------- badges, names, wear ---------- */
.wbadge {
  position: relative; width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 10px;
  color: var(--rc); background: color-mix(in srgb, var(--rc) 13%, #0b1018);
  border: 1px solid color-mix(in srgb, var(--rc) 50%, transparent);
  box-shadow: 0 0 16px -8px var(--rc), inset 0 0 12px -6px var(--rc);
}
.wbadge-code { font: 700 12px/1 var(--font-display); letter-spacing: 0.04em; text-shadow: 0 0 10px color-mix(in srgb, var(--rc) 70%, transparent); }
.wbadge-star { position: absolute; top: 2px; right: 4px; font-size: 9px; line-height: 1; }
.wbadge-sm { width: 32px; height: 32px; border-radius: 8px; }
.wbadge-sm .wbadge-code { font-size: 10px; }
.wbadge-lg { width: 64px; height: 64px; border-radius: 14px; }
.wbadge-lg .wbadge-code { font-size: 16px; }
.iname { display: grid; min-width: 0; line-height: 1.2; text-align: left; }
.iname-w { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iname-f { font: 600 14.5px/1.25 var(--font-body); color: var(--ink); overflow-wrap: anywhere; }
.iname-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.wchip { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 5px; font: 700 10.5px/1.3 var(--font-mono); letter-spacing: 0.04em; color: #071018; }
.w-FN { background: var(--fn); }
.w-MW { background: var(--mw); }
.w-FT { background: var(--ft); }
.w-WW { background: var(--ww); }
.w-BS { background: var(--bs); }
.w-VAN { background: #c9b27a; }
.ldot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; background: var(--rc); box-shadow: 0 0 8px var(--rc); vertical-align: 1px; }

/* float bar */
.fbar { position: relative; height: 8px; border-radius: 4px; background: #182130; margin: 8px 0 6px; }
.fseg { position: absolute; top: 0; bottom: 0; opacity: 0.72; }
.fseg:first-child { border-radius: 4px 0 0 4px; }
.fseg:nth-child(5) { border-radius: 0 4px 4px 0; }
.fs-FN { background: var(--fn); }
.fs-MW { background: var(--mw); }
.fs-FT { background: var(--ft); }
.fs-WW { background: var(--ww); }
.fs-BS { background: var(--bs); }
.fmask { position: absolute; top: -1px; bottom: -1px; background: repeating-linear-gradient(135deg, rgba(7, 10, 16, 0.88) 0 4px, rgba(7, 10, 16, 0.7) 4px 8px); }
.fmark { position: absolute; top: -5px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px #070a10, 0 0 10px rgba(255, 255, 255, 0.8); }
.frange { position: absolute; top: -10px; height: 28px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.frange::-webkit-slider-runnable-track { height: 28px; background: transparent; }
.frange::-moz-range-track { height: 28px; background: transparent; }
.frange::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 24px; margin-top: 2px; border-radius: 3px; background: #fff; border: 2px solid #070a10; box-shadow: 0 0 10px rgba(255, 255, 255, 0.7); }
.frange::-moz-range-thumb { width: 8px; height: 20px; border-radius: 3px; background: #fff; border: 2px solid #070a10; box-shadow: 0 0 10px rgba(255, 255, 255, 0.7); }

/* ---------- contract ---------- */
.contract-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
.slot {
  display: grid; gap: 6px; padding: 10px 10px 8px; border-radius: 12px; min-width: 0;
  border: 1px solid color-mix(in srgb, var(--rc) 42%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 13%, transparent), transparent 52%), var(--panel-2);
  box-shadow: inset 3px 0 0 var(--rc), 0 0 24px -14px var(--rc);
}
.slot-empty {
  display: grid; place-items: center; align-content: center; gap: 4px; min-height: 150px; padding: 12px;
  color: var(--muted); cursor: pointer; border: 1px dashed var(--line-2); background: rgba(255, 255, 255, 0.015); box-shadow: none;
  font: 600 14px var(--font-body);
}
.slot-empty:hover { color: var(--accent); border-color: rgba(63, 208, 255, 0.5); background: rgba(63, 208, 255, 0.04); }
.slot-empty small { color: var(--muted); font-weight: 500; }
.slot-top { display: flex; align-items: flex-start; gap: 6px; }
.slot-item { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-align: left; }
.slot-float { display: flex; align-items: center; gap: 6px; }
.slot-float .numf { flex: 1; min-width: 0; min-height: 32px; font-size: 13px; }
.slot-price { margin-left: auto; font-size: 13px; color: var(--ink); white-space: nowrap; }
.slot-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }
.slot-foot .muted { margin-right: auto; }
.share { display: grid; gap: 6px; }
.share-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #182130; }
.share-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.share-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.otable { display: grid; gap: 4px; }
.otable-h, .orow { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(90px, 1fr) minmax(104px, 1fr) minmax(96px, 1fr) minmax(80px, 0.8fr); gap: 10px; align-items: center; }
.otable-h { padding: 0 10px 4px; font: 600 10.5px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.orow { padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.022); border: 1px solid transparent; box-shadow: inset 2px 0 0 var(--rc); }
.orow:hover { border-color: var(--line); }
.orow-name { display: flex; align-items: center; gap: 9px; min-width: 0; }
.orow-p { display: grid; gap: 4px; font-size: 13px; }
.pbar { height: 5px; border-radius: 3px; background: #182130; overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--rc); box-shadow: 0 0 10px var(--rc); }
.orow-f { font-size: 12.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.orow-v { font-size: 13.5px; display: grid; }
.orow-v small { color: var(--muted); font-size: 11px; }
.orow-pl { font-size: 13.5px; text-align: right; }

/* ---------- simulate ---------- */
.reel-wrap { position: relative; }
.reel {
  position: relative; overflow: hidden; border-radius: 12px; background: #080d14; border: 1px solid var(--line);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
}
.reel.idle .reel-strip { justify-content: flex-start; }
.reel-strip { display: flex; gap: 8px; padding: 14px 0 14px 8px; will-change: transform; }
.reel-marker { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--accent); box-shadow: 0 0 14px var(--accent), 0 0 2px var(--accent); border-radius: 2px; pointer-events: none; }
.reel-marker::before, .reel-marker::after { content: ''; position: absolute; left: -6px; border: 7px solid transparent; }
.reel-marker::before { top: 0; border-top-color: var(--accent); }
.reel-marker::after { bottom: 0; border-bottom-color: var(--accent); }
.rcard-i {
  flex: none; width: 128px; height: 118px; padding: 10px; border-radius: 10px; display: grid; align-content: start; gap: 3px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 20%, #0d131d), #0b1119 70%);
  border: 1px solid color-mix(in srgb, var(--rc) 40%, transparent); border-bottom: 3px solid var(--rc);
  overflow: hidden;
}
.rcard-code { font: 700 20px/1 var(--font-display); color: var(--rc); text-shadow: 0 0 14px color-mix(in srgb, var(--rc) 70%, transparent); margin-bottom: 6px; }
.rcard-w { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard-f { font: 600 13px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard-wear { font: 600 10.5px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard-i.win.done { box-shadow: 0 0 0 2px var(--rc), 0 0 34px -2px var(--rc); animation: pop 0.45s ease-out; }
@keyframes pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.spin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 44px; }
.spin-note { margin: 0; }
.spin-result { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 8px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--rc) 45%, transparent); background: color-mix(in srgb, var(--rc) 9%, transparent); }
.sr-name { display: flex; align-items: center; gap: 8px; }
.sr-name strong { font: 600 16px var(--font-body); }
.sr-meta { font-size: 13px; color: var(--ink-2); }
.sr-val { font-size: 15px; display: flex; gap: 10px; }
.roll-controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.ctl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl-l { font: 600 11px/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.ctl-group select { max-width: 260px; }
.bank-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-top: 10px; border-top: 1px solid var(--line); }
.progress { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress-bar { flex: 1; min-width: 140px; height: 6px; border-radius: 3px; background: #182130; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: width 0.12s; }
.progress-bar span.indef { width: 40% !important; animation: indef 1.1s ease-in-out infinite; }
@keyframes indef { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.tiles-sim { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.charts-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.chart { position: relative; width: 100%; overflow: hidden; }
.chart svg { display: block; }
.chart .grid { stroke: rgba(148, 178, 220, 0.1); stroke-width: 1; }
.chart .baseline { stroke: rgba(148, 178, 220, 0.42); stroke-dasharray: 4 4; }
.chart .axis { fill: var(--muted); font: 11px var(--font-mono); }
.chart .cross { stroke: rgba(232, 238, 246, 0.4); stroke-width: 1; }
.chart .endpoint { filter: drop-shadow(0 0 6px currentColor); }
.chart-empty { display: grid; place-items: center; min-height: 180px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 12px; padding: 16px; text-align: center; }
.tip { position: absolute; pointer-events: none; transform: translate(-50%, -125%); background: #0b111a; border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 9px; font: 12px var(--font-mono); white-space: nowrap; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
.dist { display: grid; gap: 8px; }
.dist-legend { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg-exp, .lg-obs { display: inline-block; width: 18px; height: 8px; border-radius: 2px; }
.lg-exp { border: 1px solid var(--ink-2); }
.lg-obs { background: var(--accent); margin-left: 8px; }
.dist-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(70px, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
.dist-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dist-bars { position: relative; height: 14px; }
.dbar { position: absolute; left: 0; height: 100%; border-radius: 3px; }
.dbar.exp { border: 1px solid rgba(232, 238, 246, 0.5); }
.dbar.obs { top: 3px; height: 8px; background: var(--rc); opacity: 0.85; box-shadow: 0 0 10px var(--rc); }
.dist-num { white-space: nowrap; color: var(--ink-2); }
.dist-num em { font-style: normal; color: var(--ink); }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ltable, .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ltable th, .ptable th { text-align: left; font: 600 10.5px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ltable td, .ptable td { padding: 7px 8px; border-bottom: 1px solid rgba(148, 178, 220, 0.06); white-space: nowrap; }
.ptable tbody th { font: 500 13px var(--font-body); text-transform: none; letter-spacing: 0; color: var(--ink); }
.ptable .numf { width: 120px; }
.ltable tbody tr:hover { background: rgba(255, 255, 255, 0.025); }
.pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- market ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; background: var(--field); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 10px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; border: 0 !important; background: transparent !important; min-height: 40px; outline: none; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip {
  border: 1px solid color-mix(in srgb, var(--rc) 50%, transparent); color: var(--rc); background: transparent;
  padding: 5px 11px; border-radius: 999px; font: 700 11.5px/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
}
.rchip.on { background: color-mix(in srgb, var(--rc) 20%, transparent); color: #fff; box-shadow: 0 0 16px -6px var(--rc); }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 10px; }
.icard {
  display: grid; gap: 6px; align-content: start; text-align: left; padding: 12px; border-radius: 12px; cursor: pointer; color: inherit; min-width: 0;
  border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 11%, transparent), transparent 48%), var(--panel-2);
  box-shadow: inset 0 2px 0 var(--rc);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.icard:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--rc) 70%, transparent); box-shadow: inset 0 2px 0 var(--rc), 0 10px 30px -14px var(--rc); }
.icard-top { display: flex; align-items: center; gap: 8px; }
.icard-r { font: 700 10.5px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--rc); margin-right: auto; }
.icard-prices { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11.5px; color: var(--ink-2); }
.icard-prices b { color: var(--muted); font-weight: 600; margin-right: 3px; }
.manager-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; align-items: start; }
.form-grid { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.form-grid > label { font-size: 13.5px; color: var(--ink-2); }
.form-span { grid-column: 1 / -1; }
.pattern-list { display: grid; gap: 8px; }
.pattern { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; padding: 8px 10px; border-radius: 9px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); }
.pattern strong { width: 100%; font-size: 12.5px; }
.sheet-head { display: flex; align-items: center; gap: 14px; }
.sheet-meta { display: grid; gap: 6px; justify-items: start; }
.caps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.caps-bar { flex: 1 1 100%; }

/* ---------- finder ---------- */
.finder-form { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px 22px; }
.finder-target, .finder-float { display: grid; gap: 8px; align-content: start; }
.finder-opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.finder-pos { display: grid; gap: 4px; min-width: 240px; flex: 1; }
.finder-pos input[type='range'] { accent-color: var(--accent); width: 100%; }
.target-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: inherit;
  border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); background: color-mix(in srgb, var(--rc) 9%, var(--field));
}
.target-btn .iname { flex: 1; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.res { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); align-content: start; }
.res-best { border-color: rgba(63, 208, 255, 0.5); box-shadow: 0 0 30px -16px var(--accent); }
.res-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.res-h strong { margin-right: auto; font: 600 14px var(--font-body); }
.res-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.res-stats span { display: grid; gap: 2px; }
.res-stats small { font: 600 10px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.res-stats b { font-size: 14px; font-weight: 600; }
.res-inputs { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.res-inputs li { overflow-wrap: anywhere; }
.res .btn { justify-self: start; }

/* ---------- picker / modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(3, 6, 10, 0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal { width: min(600px, 100%); max-height: min(88vh, 860px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: rgba(13, 19, 28, 0.94); }
.modal-wide { width: min(860px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font: 600 16px/1.3 var(--font-display); letter-spacing: 0.04em; }
.modal-b { overflow: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
.modal-f { padding: 12px 16px; border-top: 1px solid var(--line); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.plist li { display: flex; align-items: center; gap: 8px; padding-right: 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.025); box-shadow: inset 2px 0 0 var(--rc); }
.prow { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px; background: none; border: 0; cursor: pointer; text-align: left; color: inherit; }
.prow .iname { flex: 1; }
.prow-p { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.plist li:hover { background: rgba(255, 255, 255, 0.05); }
.export-text { min-height: 220px; }

/* ---------- console ---------- */
.console {
  position: fixed; z-index: 40; right: 16px; top: 84px; bottom: 16px; width: min(440px, calc(100vw - 32px));
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; overflow: hidden;
  background: rgba(10, 15, 23, 0.92); border-color: rgba(63, 208, 255, 0.3);
  box-shadow: 0 0 0 1px rgba(63, 208, 255, 0.08), 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 40px -20px var(--accent);
  animation: slidein 0.18s ease-out;
}
@keyframes slidein { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.console-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.console-h h2 { margin: 0; font: 600 13px/1.2 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.console-h-r { display: flex; align-items: center; gap: 6px; }
.console-log { overflow-y: auto; padding: 12px 14px; display: grid; gap: 8px; align-content: start; font: 13px/1.45 var(--font-mono); }
.cl { display: flex; gap: 8px; color: var(--ink-2); overflow-wrap: anywhere; }
.cl-you { color: var(--ink); }
.cl-p { color: var(--accent); }
.cl-claude { color: #d6b8ff; }
.cl.tone-good { color: var(--good); }
.cl.tone-bad { color: var(--bad); }
.cl.tone-muted { color: var(--muted); }
.cl-help { display: grid; gap: 6px; font-size: 12px; }
.cl-help div { display: grid; gap: 2px; }
.cl-help strong { color: var(--accent); font-weight: 600; }
.console-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; border-top: 1px solid var(--line); scrollbar-width: thin; }
.console-in { display: flex; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.console-in input { flex: 1; font-family: var(--font-mono) !important; font-size: 13.5px; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 10px; background: rgba(12, 18, 27, 0.96); border: 1px solid var(--line-2); box-shadow: 0 16px 34px -14px rgba(0, 0, 0, 0.8); font-size: 14px; animation: toast 0.2s ease-out; }
.toast.tone-good { border-color: rgba(62, 224, 143, 0.5); }
.toast.tone-bad { border-color: rgba(255, 96, 112, 0.55); }
@keyframes toast { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- responsive ---------- */
@media (min-width: 1100px) {
  .app.with-console { padding-right: 476px; max-width: none; }
  .app.with-console .hdr { margin-right: -460px; }
}
@media (max-width: 1060px) {
  .contract-grid, .charts-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .tabs-top { display: none; }
  .tabs-bottom {
    display: flex; position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
    justify-content: space-around; padding: 6px;
  }
  .tabs-bottom a { flex: 1; flex-direction: column; gap: 4px; padding: 8px 4px; font-size: 10.5px; justify-content: center; }
  .tabs-bottom a.on { box-shadow: inset 0 2px 0 var(--accent); }
  .finder-form { grid-template-columns: minmax(0, 1fr); }
  .toasts { bottom: calc(88px + env(safe-area-inset-bottom)); }
  .console { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: min(74vh, 620px); border-radius: 18px 18px 0 0; animation-name: slideup; }
  @keyframes slideup { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .app { padding-left: 10px; padding-right: 10px; }
  .hdr { margin: 0 -10px 12px; padding-left: 10px; padding-right: 10px; gap: 8px; }
  .brand-sub, .hide-sm { display: none; }
  .console-btn span { display: none; }
  .console-btn { min-height: 36px; padding: 7px 9px; }
  .panel { padding: 12px; }
  .toolbar { padding: 10px; gap: 10px 14px; }
  .toolbar select { flex: 1 1 100%; }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .slot { padding: 8px 8px 6px; }
  .slot .wbadge { width: 34px; height: 34px; }
  .slot .wbadge-code { font-size: 10px; }
  .iname-f { font-size: 13.5px; }
  .slot-float { flex-wrap: wrap; }
  .slot-float .numf { flex: 1 1 100%; }
  .slot-price { margin-left: auto; }
  .slot-foot .muted { display: none; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile { padding: 10px 11px; }
  .tile-v { font-size: 17px; }
  .tile-big .tile-v { font-size: 20px; }
  .otable-h { display: none; }
  .orow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'name pl' 'p v' 'f f'; gap: 6px 10px; }
  .orow-name { grid-area: name; }
  .orow-pl { grid-area: pl; }
  .orow-p { grid-area: p; }
  .orow-v { grid-area: v; text-align: right; }
  .orow-f { grid-area: f; }
  .rcard-i { width: 112px; height: 108px; }
  .rcard-code { font-size: 17px; }
  .roll-controls .btn.big { flex: 1 1 100%; }
  .ctl-group select { max-width: 100%; flex: 1 1 100%; }
  .igrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .icard { padding: 10px; }
  .manager-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .rgrid { grid-template-columns: minmax(0, 1fr); }
  .res-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal-wrap { padding: 0; place-items: end stretch; }
  .modal, .modal-wide { width: 100%; max-height: 92vh; border-radius: 18px 18px 0 0; }
  .dist-row { grid-template-columns: minmax(0, 1fr) 64px auto; }
}
@media (max-width: 380px) {
  .igrid, .slots { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---------- scanner ---------- */
.scan-prompt { display: grid; gap: 8px; }
.scan-row { display: flex; gap: 8px; }
.scan-row input { flex: 1; min-width: 0; font-size: 15px; }
.scan-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scan-read { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.scan-read .tag { margin-left: 0; }
.scan-filters { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255, 255, 255, 0.02); }
.scan-filters[open] { display: grid; gap: 12px; }
.scan-filters summary { cursor: pointer; font: 600 12px/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.scan-filters input[type='range'] { accent-color: var(--accent); width: 100%; }
.find-me { margin-left: auto; }
@media (max-width: 640px) {
  .find-me { margin-left: 0; flex: 1 1 100%; }
  .scan-row { flex-wrap: wrap; }
  .scan-row .btn { flex: 1 1 100%; }
  .scan-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .scan-chips .chip-btn { flex: none; }
}

/* search depth + scan progress */
.depth { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.02); }
.depth-h { display: flex; align-items: center; gap: 8px; }
.depth-h .ctl-l { margin: 0; }
.depth .seg { width: 100%; }
.depth .seg button { flex: 1; }
.depth-sum { margin: 0; color: var(--ink-2); }
.depth-sum strong { color: var(--ink); }
.depth .scan-filters { background: transparent; }
.knob-hint { display: block; font-size: 11.5px; line-height: 1.35; margin-top: 2px; max-width: 34ch; }
.knob-sim { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.scan-progress { display: grid; gap: 8px; }
.scan-bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.06); overflow: hidden; border: 1px solid var(--line); }
.scan-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2, #7cf3ff)); transition: width 0.25s ease; }
.scan-progress-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .scan-bar span { transition: none; } }
.no-results { display: grid; gap: 8px; justify-items: center; text-align: center; }
.no-results p { margin: 0; }
.no-results-tags { justify-content: center; }
.no-results-btns { justify-content: center; }

/* every-collection view */
.colgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.colcard { display: grid; gap: 6px; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.025); color: var(--ink); font: inherit; cursor: pointer; }
.colcard:hover, .colcard:focus-visible { border-color: var(--line-2); background: rgba(255, 255, 255, 0.05); }
.colcard-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.colcard-h strong { font-size: 14px; line-height: 1.3; }
.colcard-h .tag { flex: none; margin-left: 0; }
.colcard-r { display: flex; flex-wrap: wrap; gap: 4px; }
.rchip { display: inline-flex; gap: 4px; align-items: baseline; padding: 1px 7px; border-radius: 6px; font: 600 11px/1.6 var(--font-body); color: var(--ink-2); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); background: color-mix(in srgb, var(--rc) 12%, transparent); }
.rchip b { color: var(--ink); font-family: var(--font-mono, monospace); }
.warn-text { color: var(--warn); }
/* Claude key box in the console */
.keybox { margin: 0 14px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.02); }
.keybox summary { cursor: pointer; font: 600 12px/1.3 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.keybox-b { display: grid; gap: 8px; margin-top: 8px; }
.keybox-b p { margin: 0; }
.keybox-b input, .keybox-b select { width: 100%; }
/* the server version adds the Claude key box above the log: keep the log as the stretching row */
.console.has-keybox { grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
.console .keybox { margin: 10px 14px 0; align-self: start; max-height: 40vh; overflow-y: auto; }
